name: BetterInsight DB - manual check or apply

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only check, or explicitly approved apply?"
        type: choice
        required: true
        default: check
        options:
          - check
          - apply
      approval:
        description: "Only for apply: type APPLY-BETTERINSIGHT-DEV"
        type: string
        required: false
        default: ""
  # Once, after updating this workflow, check the NEW connection without
  # requiring the user to copy code or trigger deployment.
  push:
    branches: [main]
    paths: [".github/workflows/betterinsight-db-manual.yml"]

permissions:
  contents: read

concurrency:
  group: betterinsight-dev-database
  cancel-in-progress: false

jobs:
  database:
    name: Verify BetterInsight-dev only
    if: github.repository == 'betinsightclub/betterinsight'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BETTERINSIGHT_DATABASE_URL: ${{ secrets.BETTERINSIGHT_DATABASE_URL }}
    steps:
      - name: Checkout isolated BetterInsight source
        uses: actions/checkout@v4
        with:
          ref: dev/betterinsight-cloudflare
          persist-credentials: false

      - name: Check URL points only to BetterInsight-dev (never print secret)
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit

          raw = os.environ.get("BETTERINSIGHT_DATABASE_URL", "")
          if not raw:
              raise SystemExit("Secret BETTERINSIGHT_DATABASE_URL is missing. No database action performed.")

          # Diagnose the common Supabase password placeholder and square-bracket
          # URL parsing issue without ever printing the secret or any character of it.
          suspected_placeholder = "[YOUR-PASSWORD]" in raw or "%5BYOUR-PASSWORD%5D" in raw.upper()
          print("Credential check unreplaced_supabase_placeholder: "
                + ("YES" if suspected_placeholder else "NO"))
          parse_has_bracket_issue = False
          try:
              urlsplit(raw)
          except ValueError:
              parse_has_bracket_issue = ("[" in raw or "]" in raw)
          print("Credential check unencoded_square_brackets: "
                + ("YES" if parse_has_bracket_issue else "NO"))
          # Print only validation FLAGS, never any secret or URL components.
          # This diagnoses malformed connection strings without revealing credentials.
          checks = {
              "scheme": False,
              "project_user": False,
              "password_present": False,
              "password_not_placeholder": False,
              "session_pooler_host": False,
              "port_5432": False,
              "database_postgres": False,
              "no_extra_whitespace": raw == raw.strip(),
          }
          try:
              url = urlsplit(raw)
              checks["scheme"] = url.scheme in ("postgres", "postgresql")
              checks["project_user"] = url.username == "postgres.nefgspsbamcsmrjkpnis"
              checks["password_present"] = bool(url.password)
              checks["password_not_placeholder"] = bool(url.password) and (
                  url.password not in ("YOUR-PASSWORD", "[YOUR-PASSWORD]", "%5BYOUR-PASSWORD%5D")
              )
              checks["session_pooler_host"] = (
                  re.fullmatch(
                      r"aws-[0-9]+-[a-z0-9-]+\.pooler\.supabase\.com",
                      url.hostname or "",
                  ) is not None
              )
              checks["port_5432"] = url.port == 5432
              checks["database_postgres"] = url.path == "/postgres"
          except (ValueError, TypeError):
              pass
          # Safe shape diagnosis; do not print any portion of the secret.
          shape = {
              "full_postgresql_uri_prefix": raw.lower().startswith(("postgresql://", "postgres://")),
              "uri_embedded_in_other_text": (
                  not raw.lower().startswith(("postgresql://", "postgres://"))
                  and ("postgresql://" in raw.lower() or "postgres://" in raw.lower())
              ),
              "wrapped_in_quotes": raw.startswith(('"', "'")) and raw.endswith(('"', "'")),
              "has_uri_separator": "://" in raw,
          }
          for name, passed in shape.items():
              print(f"Shape check {name}: {'YES' if passed else 'NO'}")
          for name, passed in checks.items():
              print(f"Format check {name}: {'OK' if passed else 'INVALID'}")
          if not all(checks.values()):
              raise SystemExit(
                  "Saved database connection format failed validation. "
                  "No connection attempted; no database action performed."
              )
          print("Verified project-scoped BetterInsight-dev pooler URL (secret kept hidden).")
          PY

      - name: Test connection and RLS on six BetterInsight tables (read-only)
        if: ${{ github.event_name == 'push' || inputs.operation == 'check' }}
        shell: bash
        env:
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "15"
          PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=15000"
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          count="$(psql --dbname="$BETTERINSIGHT_DATABASE_URL" -X -A -t -q -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM pg_tables WHERE schemaname = 'public' AND rowsecurity = true AND tablename IN ('market_countries', 'market_categories', 'market_listings', 'market_conversations', 'market_messages', 'market_profiles');")"
          if [ "$count" != "6" ]; then
            echo "::error::Expected 6 RLS-protected BetterInsight tables, got $count. No changes made."
            exit 1
          fi
          echo "Connected successfully. All 6 BetterInsight foundation tables have RLS enabled."
          echo "Read-only database connectivity check passed. No migrations applied."

      - name: Require explicit approval before applying any migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'apply' }}
        env:
          APPROVAL: ${{ inputs.approval }}
        run: |
          if [ "$APPROVAL" != "APPLY-BETTERINSIGHT-DEV" ]; then
            echo "::error::Apply requires typing APPLY-BETTERINSIGHT-DEV. No changes made."
            exit 1
          fi
          if ! compgen -G 'infra/betterinsight/supabase/migrations/*_*.sql' >/dev/null; then
            echo "::error::No reviewed BetterInsight migrations available. Nothing to apply."
            exit 1
          fi

      - name: Install pinned Supabase CLI for approved migration only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'apply' }}
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Apply only reviewed BetterInsight migrations (never original UT migrations)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'apply' }}
        working-directory: infra/betterinsight
        shell: bash
        run: |
          supabase db push --db-url "$BETTERINSIGHT_DATABASE_URL" --yes

# No Cloudflare deployment, no changes to other Supabase organizations.
# Push events only perform a read-only check; applying requires manual selection
# and exact confirmation string. No credentials are printed to logs.
